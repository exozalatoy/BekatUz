services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bekatuz
      POSTGRES_PASSWORD: bekatuz
      POSTGRES_DB: bekatuz
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bekatuz -d bekatuz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bekatuz:bekatuz@db:5432/bekatuz
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.scripts.migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app

  web:
    build: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./web:/app
      - /app/node_modules

  admin:
    build: ./admin
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./admin:/app
      - /app/node_modules

volumes:
  db_data:
